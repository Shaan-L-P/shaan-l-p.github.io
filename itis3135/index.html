<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaan's Webpage</title>

    <style>
        :root {
            --bg: #b8d8fb;
            --pill-bg: #b8c8fa;
            --pill-text: #2e3f9c;
            --heading: #2f6f9f;
            --divider: #2e3f9c;
            --link: #2e3f9c;
            --text: #2a2a3a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 1.5rem 3rem;
            background-color: var(--bg);
            font-family: "Courier New", Courier, monospace;
            color: var(--text);
        }

        header.pill {
            background-color: var(--pill-bg);
            border-radius: 999px;
            margin: 1.5rem 0;
            padding: 1.2rem 1.5rem;
            text-align: center;
        }

        header.pill h1 {
            margin: 0;
            color: var(--pill-text);
            font-size: 2.2rem;
            font-weight: bold;
        }

        hr.divider {
            border: none;
            border-top: 4px dashed var(--divider);
            margin: 1.5rem 0;
        }

        h2 {
            color: var(--heading);
            font-size: 1.6rem;
        }

        p {
            font-size: 1.1rem;
            color: var(--heading);
        }

        a {
            color: var(--link);
            text-decoration: underline;
            font-weight: bold;
        }

        a:hover,
        a:focus {
            color: #2e1f66;
        }

        footer.root-line {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text);
        }

        footer.root-line a {
            color: var(--link);
            text-decoration: underline;
            font-weight: bold;
        }

        a:focus {
            outline: 2px solid var(--divider);
            outline-offset: 2px;
        }

        .site-credit {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: var(--text);
        }
    </style>
</head>

<body>

    <header class="pill">
        <h1>Shaan's Webpage</h1>
    </header>

    <hr class="divider">

    <h2>Hi there!</h2>

    <p>
        Welcome to my personal webpage! I'm a computer science student
        concentrating in cybersecurity here at UNC Charlotte.
    </p>

    <hr class="divider">

    <footer class="root-line">
        This is the root of my website!
        <a href="itis3135/">Click to go to my ITIS3135 Site</a>
    </footer>

    <p class="site-credit">
        &copy; 2026 Shaan Patel. Designed by Shaan Patel.
    </p>

</body>
</html>
