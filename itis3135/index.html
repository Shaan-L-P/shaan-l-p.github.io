<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaan's Course Site</title>

<style>
  :root {
    --bg: #b8d8fb;
    --pill-bg: #b8c8fa;
    --pill-text: #2e3f9c;
    --heading: #2f6f9f;
    --divider: #2e3f9c;
    --link: #2e3f9c;
    --text: #2a2a3a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0 1.5rem 3rem;
    background-color: var(--bg);
    font-family: "Courier New", Courier, monospace;
    color: var(--text);
    line-height: 1.6;
  }

  header.pill {
    background-color: var(--pill-bg);
    border-radius: 999px;
    margin: 1.5rem 0;
    padding: 1.2rem 1.5rem;
    text-align: center;
  }

  header.pill h1 {
    margin: 0;
    color: var(--pill-text);
    font-size: 2.2rem;
    font-weight: bold;
  }

  nav {
    text-align: center;
    margin: 1.5rem 0;
  }

  nav a {
    color: var(--link);
    text-decoration: underline;
    font-weight: bold;
    margin: 0 1rem;
  }

  nav a:hover,
  nav a:focus {
    color: #2e1f66;
  }

  hr.divider {
    border: none;
    border-top: 4px dashed var(--divider);
    margin: 1.5rem 0;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
  }

  h2 {
    color: var(--heading);
    font-size: 1.6rem;
  }

  p {
    font-size: 1.1rem;
    color: var(--heading);
  }

  a:focus {
    outline: 2px solid var(--divider);
    outline-offset: 2px;
  }

  footer {
    margin-top: 2.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text);
  }

  footer a {
    color: var(--link);
    text-decoration: underline;
    font-weight: bold;
  }
</style>
</head>

<body>

<header class="pill">
  <h1>Shaan's Course Site</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="introduction.html">Introduction</a>
  <a href="contract.html">Course Contract</a>
</nav>

<hr class="divider">

<main>

  <h2>Welcome!</h2>

  <p>
    Welcome to my course website! This website contains my work and
    information for the semester.
  </p>

  <p>
    Use the links above to learn more about me and view my course contract.
  </p>

</main>

<hr class="divider">

<footer>
  <a href="#">YOUR FIRM NAME</a> ©2026
</footer>

</body>
</html>
